name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build release
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          gradle :app:assembleRelease --no-daemon
          cp app/build/outputs/apk/release/*.apk guildmaster.apk

      - uses: actions/upload-artifact@v4
        with:
          name: guildmaster-apk
          path: guildmaster.apk

      # App trong máy dò release mới nhất để tự cập nhật
      - name: Tạo GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Bản 0.1.${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: guildmaster.apk
